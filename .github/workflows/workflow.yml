name: ci

on:
  push:
    branches:
      - $default-branch
      - cicd-setup
  pull_request:
    branches:
      - $default-branch
      - cicd-setup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
#        python-version: ["3.12", "3.13", "3.14", "3.15"]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Lint and format
        run: |
          uv add -dev ruff  # Should be redundant with the pyproject.toml
          ruff check --fix
          ruff format

#      - name: Type checks
#        run: |
#           uv tool install mypy
#           mypy .

#      - name: Security checks
#        run: |
#          uv tool install bandit
#          bandit -r your_package_name

#      - name: Upload coverage
#        if: ${{ matrix.python-version == '3.13' }}
#        run: coverage xml
        # then use an action to upload to GitHub or codecov

      - name: Test
        run: | 
          uv add --dev pytest coverage # Should be redundant with the pyproject.toml
          pytest --cov